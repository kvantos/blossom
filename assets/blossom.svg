<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Blossom</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7fa"/>
      <stop offset="1" stop-color="#fbe3ec"/>
    </linearGradient>
    <radialGradient id="petal" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0.2" stop-color="#c2457a"/>
      <stop offset="1" stop-color="#e58fb1"/>
