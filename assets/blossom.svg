    <path id="p" d="M256 262 C 184 230 176 132 226 104 C 240 96 250 104 256 114 C 262 104 272 96 286 104 C 336 132 328 230 256 262 Z"/>
    <use href="#p" transform="rotate(72 256 262)"/>
    <use href="#p" transform="rotate(144 256 262)"/>
    <use href="#p" transform="rotate(216 256 262)"/>
    <use href="#p" transform="rotate(288 256 262)"/>
  </g>
  <circle cx="256" cy="262" r="34" fill="#f6c344" stroke="#fff7fa" stroke-width="6"/>
  <g fill="#e0a21b">
    <circle cx="246" cy="252" r="5"/>
    <circle cx="268" cy="256" r="5"/>
    <circle cx="252" cy="274" r="5"/>
