# The quality gates from docs/PLAN.md section 2, on Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (blsm and the app without built-in models)
        run: cargo clippy -p blsm -p blossom-app --no-default-features --all-targets -- -D warnings
      # Also with the built-in models (candle), which are behind a feature.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  # A short run of every fuzz target (fuzz/, `make fuzz-all`) on stable
  # Rust, then the minimal corpus replayed under Valgrind for memory errors
  # a panic can't show. Only the minimal corpus is cached (it grows with
  # coverage, not with time), so each run carries on from the last one.
  fuzz:
    name: fuzz (60 s per target, then Valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind libc6-dbg
      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/min
          key: fuzz-corpus-min-${{ github.run_id }}
          restore-keys: fuzz-corpus-min-
      - name: Fuzz
        run: make fuzz-all SECS=60
      - name: Replay under Valgrind
        run: make fuzz-valgrind
      # Replay one locally with `make fuzz-repro FUZZ=<target> CRASH=<file>`.
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
