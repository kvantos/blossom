# The quality gates from docs/PLAN.md section 2, on Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (blsm and the app without built-in models)
        run: cargo clippy -p blsm -p blossom-app --no-default-features --all-targets -- -D warnings
      # Also with the built-in models (candle), which are behind a feature.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      # The fuzz targets need nightly to run, but must keep compiling.
      - name: Check fuzz targets
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml
