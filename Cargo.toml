[workspace]
resolver = "3"
members = [
    "crates/orgize",
    "crates/blossom-core",
    "crates/blossom-vault",
    "crates/blossom-index",
    "crates/blsm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
orgize = { path = "crates/orgize" }
blossom-core = { path = "crates/blossom-core" }
blossom-vault = { path = "crates/blossom-vault" }
blossom-index = { path = "crates/blossom-index" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
notify = "9"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
tempfile = "3"
toml = "1"

# Strict lints for our own crates. The vendored orgize fork does not opt in.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# Carried over from upstream orgize: speeds up snapshot tests.
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
