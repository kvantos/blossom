[workspace]
resolver = "3"
members = [
    "crates/orgize",
    "crates/blossom-core",
    "crates/blossom-vault",
    "crates/blossom-index",
    "crates/blossom-semantic",
    "crates/blsm",
    "crates/blossom-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
orgize = { path = "crates/orgize" }
blossom-core = { path = "crates/blossom-core" }
blossom-vault = { path = "crates/blossom-vault" }
blossom-index = { path = "crates/blossom-index" }
blossom-semantic = { path = "crates/blossom-semantic" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
sha2 = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3.5.2", features = ["json"] }
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
fontdb = "0.23"
iced = { version = "0.14", features = ["advanced", "canvas", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "9"
proptest = "1"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"
tempfile = "3"
toml = "1"
toml_edit = "0.25"

# Strict lints for our own crates. The vendored orgize fork does not opt in.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# Carried over from upstream orgize: speeds up snapshot tests.
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
