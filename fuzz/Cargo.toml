# libFuzzer targets, built and run on stable Rust by `make fuzz` (see the
# Makefile; no nightly or cargo-fuzz needed). Not a workspace member, so
# the main build never compiles libFuzzer's C++.
[package]
name = "blossom-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orgize = { path = "../crates/orgize" }
blossom-core = { path = "../crates/blossom-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Detach from the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "splice"
path = "fuzz_targets/splice.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false
