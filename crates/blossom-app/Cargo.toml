[package]
name = "blossom-app"
description = "The Blossom desktop app (iced)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "blossom"
path = "src/main.rs"

[features]
default = ["builtin-model"]
# The built-in embedding models for search by meaning (else only a server).
builtin-model = ["blossom-semantic/builtin-model"]

[dependencies]
arboard.workspace = true
blossom-core.workspace = true
blossom-index.workspace = true
blossom-semantic.workspace = true
blossom-vault.workspace = true
chrono = { workspace = true, features = ["clock"] }
fontdb.workspace = true
iced.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
