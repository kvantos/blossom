chrono = { workspace = true, features = ["clock"] }
iced.workspace = true
image.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
