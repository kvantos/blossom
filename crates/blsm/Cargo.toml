[package]
name = "blsm"
description = "Command-line tool for a Blossom org vault: search, agenda, capture, todo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["builtin-model"]
# The built-in embedding models for `search --semantic` (else only a server).
builtin-model = ["blossom-semantic/builtin-model"]

[dependencies]
blossom-core.workspace = true
blossom-index.workspace = true
blossom-semantic.workspace = true
blossom-vault.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
