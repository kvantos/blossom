[package]
name = "blossom-semantic"
description = "Semantic search for Blossom: rank headings by meaning, vectors rebuildable from the vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The built-in models (candle BERT, downloaded on first use).
builtin-model = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:sha2",
    "dep:tokenizers",
]

[dependencies]
blossom-index.workspace = true
blossom-vault.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ureq.workspace = true

[dev-dependencies]
blossom-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
